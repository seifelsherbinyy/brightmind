[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brightmind-common"
version = "0.1.0"
description = "BrightMind shared utilities"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.2",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["common"]
